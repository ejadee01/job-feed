name: Refresh job feed

on:
  schedule:
    - cron: '0 23 * * *'   # 7:00 AM Philippine time
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build feed and page
        shell: powershell
        run: .\build-job-feed.ps1

      - name: Commit updated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.html jobs-feed.xml
          git diff --cached --quiet || git commit -m "Refresh job feed $(date -u +%Y-%m-%d)"
          git push
